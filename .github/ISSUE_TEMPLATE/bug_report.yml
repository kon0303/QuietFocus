name: Bug report
description: Report a problem with QuietFocus
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please attach the log file if possible:
        `%APPDATA%\QuietFocus\quietfocus.log`
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2 26100.xxxx"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Single-file launcher
        - Portable ZIP
        - Run from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Switch to ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log and screenshots
      description: Drag and drop the log file or screenshots here.
    validations:
      required: false
