name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build application, portable ZIP and launcher
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -Python python

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuietFocus-windows-x64
          path: |
            dist/QuietFocus.exe
            dist/QuietFocus-1.0.2-portable.zip
